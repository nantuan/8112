name: kirim-kirim 22
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  UpdateSub:
    runs-on: ubuntu-latest

    steps:
      - name: Check The Code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-telegram-bot==13.15 requests
      - name: Get Files
        run: |
          curl -o aktif1.txt -LJO https://random.diska.eu.org/?url=https://raw.githubusercontent.com/roosterkid/openproxylist/refs/heads/main/V2RAY_RAW.txt
          curl -o vm.txt -LJO https://random.diska.eu.org/?url=
          curl -o vm1.txt -LJO https://random.diska.eu.org/?url=https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vmess_configs.txt
          curl -o vm2.txt -LJO https://random.diska.eu.org/?url=https://raw.githubusercontent.com/Argh94/V2RayAutoConfig/refs/heads/main/configs/Vmess.txt
          curl -o tg.txt -LJO https://random.diska.eu.org/?url=
          curl -o tgp.txt -LJO https://random.diska.eu.org/?url=
          curl -o ss.txt -LJO https://random.diska.eu.org/?url=https://raw.githubusercontent.com/Argh94/V2RayAutoConfig/refs/heads/main/configs/Indonesia.txt
          curl -o tg1.txt -LJO https://random.diska.eu.org/?url=https://raw.githubusercontent.com/Argh94/telegram-proxy-scraper/refs/heads/main/proxy.txt
          curl -o tg2.txt -LJO https://random.diska.eu.org/?url=https://raw.githubusercontent.com/Argh94/Proxy-List/refs/heads/main/MTProto.txt
      - name: send to telegram
        run: |
          python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 aktif1.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 vm.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 vm1.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 vm2.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 tg.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 ss.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 tgp.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 tg1.txt && python3 kirim.py ${{ secrets.BOT2 }} -1002325227388 tg2.txt 



